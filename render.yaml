services:
  - type: web
    name: allen-data-hub-backend
    env: node
    plan: standard
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
      - key: JWT_SECRET
      - key: PAYSTACK_SECRET_KEY
      - key: PAYSTACK_PUBLIC_KEY
      - key: PORTAL02_API_KEY
      - key: PORTAL02_BASE_URL
      - key: BREVO_API_KEY
